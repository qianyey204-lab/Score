<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>スコア</title>

  <style>
    body {
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(2);
      transform-origin: top left;
      background-color: #ffe6f2;
      font-family: sans-serif;
      padding: 20px;
    }

    .id-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 1em;
    }

    #speed {
      font-size: 20px;
      font-weight: bold;
      padding: 5px 10px;
      border: 2px solid #444;
      margin: 10px 0;
    }

    .team-row {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* 速度ラベルとセレクトをまとめて整える */
    .speed-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .speed-label {
      font-size: 18px;
      font-weight: bold;
    }

    /* チーム名ラベルを速度と同じサイズに */
    .team-label {
      font-size: 18px;
      font-weight: bold;
      width: 100px; /* 揃えたい場合は指定 */
      display: inline-block;
    }

    /* スコアボックス */
    .Score-box {
      width: 80px;
      padding: 8px;
      border: 2px solid #444;
      background: #fff;
      font-size: 24px;
      font-weight: bold;
      text-align: right;
    }

    /* ボタンデザイン */
    .btn-plus {
      background: #28a745;
      color: white;
      padding: 6px 12px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
    }

    .btn-minus {
      background: #dc3545;
      color: white;
      padding: 6px 12px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
    }

  </style>
</head>

<body>
  <div class="id-title">&lt;スコア&gt;</div>

  <div class="speed-wrapper">
    <span class="speed-label">速度：</span>
    <select id="speed">
      <option value="normal">ノーマル</option>
      <option value="ultra">ウルトラ</option>
      <option value="superultra">超ウルトラ</option>
    </select>
  </div>

  <!-- ★ HTML 側にチームをすべて記述 ★ -->
  <div id="teams">
    <div class="team-row">
      <span class="team-label">Aチーム：</span>
      <span id="score-0" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(0)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(0)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Bチーム：</span>
      <span id="score-1" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(1)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(1)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Cチーム：</span>
      <span id="score-2" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(2)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(2)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Dチーム：</span>
      <span id="score-3" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(3)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(3)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Eチーム：</span>
      <span id="score-4" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(4)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(4)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Fチーム：</span>
      <span id="score-5" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(5)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(5)">▼ 減点</button>
    </div>

    <div class="team-row">
      <span class="team-label">Gチーム：</span>
      <span id="score-6" class="Score-box">0</span>
      <button class="btn-plus" onclick="addScore(6)">▲ 加点</button>
      <button class="btn-minus" onclick="subScore(6)">▼ 減点</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
